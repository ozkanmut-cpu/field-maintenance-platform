services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: field-maintenance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-field_maintenance}
      POSTGRES_USER: ${POSTGRES_USER:-field_maintenance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-field_maintenance} -d ${POSTGRES_DB:-field_maintenance}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
