name: SAP integration bootstrap

on:
  push:
    branches: [feat/sap-confirmation-sync-integration]
    paths:
      - '.github/workflows/sap-integration-bootstrap.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/sap-confirmation-sync-integration
      - name: Import production SAP runtime sources
        run: |
          git fetch origin feat/sap-confirmation-sync-runtime
          git checkout origin/feat/sap-confirmation-sync-runtime -- \
            apps/api/prisma/migrations/20260914001000_sap_confirmations/migration.sql \
            services/sap-connector/README.md \
            services/sap-connector/pull_teyit_203.py \
            services/sap-connector/sap_auto_login.py \
            services/sap-connector/sync_teyit_db.js \
            services/sap-connector/systemd/sap-teyit-sync.service \
            services/sap-connector/systemd/sap-teyit-sync.timer
      - name: Add SAP confirmation Prisma model
        run: |
          if ! grep -q '^model SapConfirmation ' apps/api/prisma/schema.prisma; then
            cat >> apps/api/prisma/schema.prisma <<'EOF'

          model SapConfirmation {
            confirmationId  String   @id @map("confirmation_id")
            dealer          String?  @map("dealer")
            pointCode       String?  @map("point_code")
            pointName       String?  @map("point_name")
            recordDate      DateTime @map("record_date") @db.Date
            creator         String?  @map("creator")
            netValue        Decimal? @map("net_value") @db.Decimal(14, 2)
            status          String?  @map("status")
            contact         String?  @map("contact")
            costCenter      String?  @map("cost_center")
            transactionType String?  @map("transaction_type")
            systemStatus    String?  @map("system_status")
            productId       String   @default("203") @map("product_id")
            sourceSyncedAt  DateTime @default(now()) @map("source_synced_at")
            createdAt       DateTime @default(now()) @map("created_at")
            updatedAt       DateTime @updatedAt @map("updated_at")

            @@index([recordDate])
            @@index([pointCode])
            @@index([status])
            @@map("sap_confirmations")
          }
          EOF
          fi
      - name: Validate integration
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/fmp
        run: |
          npm install --no-audit --no-fund
          npx prisma validate --schema apps/api/prisma/schema.prisma
          npx prisma generate --schema apps/api/prisma/schema.prisma
          npm run build -w @fmp/api
          python3 -m py_compile services/sap-connector/pull_teyit_203.py services/sap-connector/sap_auto_login.py
          node --check services/sap-connector/sync_teyit_db.js
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/prisma/schema.prisma apps/api/prisma/migrations/20260914001000_sap_confirmations services/sap-connector
          git commit -m 'feat(sap): integrate production confirmation sync'
          git push origin HEAD:feat/sap-confirmation-sync-integration
