name: PostGIS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgis-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: field_maintenance_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d field_maintenance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: field_maintenance_test
      POSTGRES_USER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure isolated test database
        run: >-
          printf 'DATABASE_URL=postgresql:%s%s@127.0.0.1:5432/%s\n' '//'
          "$POSTGRES_USER" "$POSTGRES_DB" >> "$GITHUB_ENV"
      - name: Generate Prisma client
        run: npm --prefix apps/api run prisma:generate
      - name: Deploy all migrations
        run: npm --prefix apps/api run prisma:deploy
      - name: Verify migration status
        run: npm --prefix apps/api run prisma:status
      - name: PostGIS workflow contract
        run: >-
          node --test --require ts-node/register
          apps/api/src/points/point-postgis-ci-workflow.spec.ts
      - name: Migration and spatial unit contracts
        working-directory: apps/api
        run: >-
          node --test --require ts-node/register
          src/points/point-postgis-migration.spec.ts
          src/points/point-spatial.integration-config.spec.ts
          src/points/point-spatial.service.spec.ts
          src/points/points.nearby.controller.spec.ts
      - name: Real PostGIS integration
        working-directory: apps/api
        run: >-
          POSTGIS_TEST_DATABASE_URL="$DATABASE_URL"
          node --test --require ts-node/register
          src/points/point-spatial.integration.spec.ts
          src/maintenance/non-maintenance-visit-migration.integration.spec.ts
      - name: API typecheck
        run: npm --prefix apps/api run lint
      - name: API build
        run: npm --prefix apps/api run build
