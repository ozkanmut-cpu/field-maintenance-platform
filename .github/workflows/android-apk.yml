name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
      - 'ops/release/mobile-apk-manifest.json'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
      - 'ops/release/mobile-apk-manifest.json'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional test-only API base URL for an isolated emulator APK'
        required: false
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      NODE_PATH: ${{ github.workspace }}/node_modules
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url || (startsWith(github.head_ref || github.ref_name, 'codex/test-apk-') && 'http://10.0.2.2:3100/api') || 'https://api.field-maintenance-prod.com/api' }}
      EXPO_PUBLIC_MOCKUP_EVIDENCE_MODE: ${{ startsWith(github.head_ref || github.ref_name, 'codex/test-apk-') && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The baseline smoke test verifies an immutable historical source commit.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Verify React versions
        run: |
          node -e "const r=require('./node_modules/react/package.json').version; const rn=require('./node_modules/react-native/package.json').version; console.log('react='+r+' react-native='+rn); if(r!=='19.1.0') process.exit(1); if(rn!=='0.81.4') process.exit(1);"

      - name: Mobile unit and smoke tests
        run: node --test apps/mobile/src/*.test.mjs

      - name: Verify released APK baseline manifest
        run: node --test apps/mobile/src/mobile-release-baseline.smoke.test.mjs

      - name: Apply mobile build patches
        run: |
          node apps/mobile/scripts/patch-location-confirmation.cjs
          node apps/mobile/scripts/use-vector-icons.cjs
          npx tsc -p apps/mobile/tsconfig.json --noEmit
          if grep -q "icons-sprite.png" apps/mobile/src/CorporateApp.tsx; then
            echo "Sprite reference still present" >&2
            exit 1
          fi

      - name: Expo prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Verify generated Android module paths
        working-directory: apps/mobile/android
        run: |
          node --print "require.resolve('react-native/package.json')"
          node --print "require.resolve('expo/package.json')"
          PROJECT_ROOT="$(cd .. && pwd)"
          node -e "require('expo/scripts/resolveAppEntry')" "$PROJECT_ROOT" android absolute
          nl -ba app/build.gradle | sed -n '1,28p'

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: field-maintenance-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
