name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      NODE_PATH: ${{ github.workspace }}/node_modules
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Verify React versions
        run: |
          node -e "const r=require('./node_modules/react/package.json').version; const rn=require('./node_modules/react-native/package.json').version; console.log('react='+r+' react-native='+rn); if(r!=='19.1.0') process.exit(1); if(rn!=='0.81.4') process.exit(1);"

      - name: Restore complete icon sprite
        run: |
          base64 --decode apps/mobile/assets/icons-sprite-fixed.b64 > apps/mobile/assets/icons-sprite.png
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          p = Path('apps/mobile/assets/icons-sprite.png').read_bytes()
          assert len(p) == 8747, len(p)
          assert p[:8] == b'\x89PNG\r\n\x1a\n'
          i = 8
          while i < len(p):
              n = struct.unpack('>I', p[i:i+4])[0]
              typ = p[i+4:i+8]
              data = p[i+8:i+8+n]
              crc = p[i+8+n:i+12+n]
              assert len(crc) == 4
              assert struct.pack('>I', zlib.crc32(typ + data) & 0xffffffff) == crc, typ
              i += 12 + n
          assert i == len(p)
          print('sprite-ok', len(p))
          PY

      - name: Expo prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Verify generated Android module paths
        working-directory: apps/mobile/android
        run: |
          node --print "require.resolve('react-native/package.json')"
          node --print "require.resolve('expo/package.json')"
          PROJECT_ROOT="$(cd .. && pwd)"
          node -e "require('expo/scripts/resolveAppEntry')" "$PROJECT_ROOT" android absolute
          nl -ba app/build.gradle | sed -n '1,28p'

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Persist corrected sprite
        run: |
          if ! git diff --quiet -- apps/mobile/assets/icons-sprite.png; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/mobile/assets/icons-sprite.png
            git commit -m "fix(mobile): persist complete icon sprite binary"
            git push origin HEAD:main
          fi

      - name: Stage APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk Field-Maintenance-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: field-maintenance-android-release-apk
          path: Field-Maintenance-release.apk
          if-no-files-found: error
          retention-days: 14
