name: Apply fici bakim brand

on:
  push:
    branches: [feat/fici-bakim-brand-icons]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fici-bakim-brand-icons
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply branding and icon system
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, base64

          p=Path('apps/mobile/src/CorporateApp.tsx')
          s=p.read_text()
          def repl(old,new):
              global s
              if old not in s:
                  raise SystemExit('missing replacement anchor: '+old[:100])
              s=s.replace(old,new)

          repl("import { ActivityIndicator, Alert, Linking, ScrollView, StyleSheet, Text, TextInput, TouchableOpacity, View } from 'react-native';\nimport { Feather } from '@expo/vector-icons';", "import { ActivityIndicator, Alert, Image, ImageSourcePropType, Linking, ScrollView, StyleSheet, Text, TextInput, TouchableOpacity, View } from 'react-native';")

          marker="type Screen = 'TASKS' | 'CUSTOMERS' | 'CUSTOMER' | 'EQUIPMENT_CONFIRM' | 'HELP' | 'NEW' | 'HISTORY' | 'EFESIM_RESULT' | 'PROSPECT' | 'VISIT_SAVED' | 'SUCCESS';\n"
          block="""
const APP_ICON = require('../assets/fici-bakim-icon.png');
const ICON_SPRITE = require('../assets/icons-sprite.png');
const ICON_ORDER = ['home','building','support','clock','check','check-circle','x','alert-circle','alert-triangle','chevron-right','arrow-left','arrow-right','log-out','log-in','navigation','refresh-cw','refresh','rotate-ccw','calendar','hash','map-pin','crosshair','info','search','save','image','inbox','snowflake','tower','tap','smarttap','tool','clipboard','users','user-plus'] as const;
const ICON_INDEX = Object.fromEntries(ICON_ORDER.map((name,index)=>[name,index])) as Record<string,number>;
const ICON_COLS = 6;
function Feather({name,size=18,color='#075A96'}:{name:string;size?:number;color?:string}) {
  const index = ICON_INDEX[name] ?? ICON_INDEX.tool;
  const col = index % ICON_COLS, row = Math.floor(index / ICON_COLS);
  return <View style={{width:size,height:size,overflow:'hidden'}}><Image source={ICON_SPRITE} style={{position:'absolute',width:size*ICON_COLS,height:size*6,left:-col*size,top:-row*size,tintColor:color}} resizeMode="stretch" /></View>;
}
"""
          s=s.replace(marker,marker+'\n'+block)

          repl('''      <View style={styles.headerIdentity}>\n        <View style={styles.brandBadge}><Feather name="tool" size={17} color="#fff" /></View>\n        <View><Text style={styles.eyebrow}>SAHA BAKIM</Text><Text style={styles.headerTitle}>{title}</Text><Text style={styles.headerUser}>{user.name}</Text></View>\n      </View>''','''      <View style={styles.headerIdentity}>\n        <Image source={APP_ICON} style={styles.brandImage} />\n        <View style={styles.headerCopy}><Text style={styles.eyebrow}>fıçıbakım</Text><Text numberOfLines={1} adjustsFontSizeToFit minimumFontScale={0.64} style={styles.headerTitle}>{title}</Text><Text style={styles.headerUser}>{user.name}</Text></View>\n      </View>''')
          repl('''      <View style={styles.loginBrandRow}><View style={styles.logoMark}><Feather name="tool" size={31} color="#fff" /></View><View><Text style={styles.loginBrand}>SAHA BAKIM</Text><Text style={styles.loginBrandSub}>FIELD MAINTENANCE</Text></View></View>''','''      <View style={styles.loginBrandRow}><Image source={APP_ICON} style={styles.loginLogo}/><View><Text style={styles.loginBrand}>fıçıbakım</Text><Text style={styles.loginBrandSub}>SAHA BAKIM</Text></View></View>''')
          s=s.replace('<Nav label="İşler" icon="clipboard"','<Nav label="İşler" icon="home"')
          s=s.replace('<Nav label="Müşterilerim" icon="users"','<Nav label="Müşterilerim" icon="building"')
          s=s.replace('<Nav label="Yardım Et" icon="user-plus"','<Nav label="Yardım Et" icon="support"')
          s=s.replace("row('coolerCount','Soğutucu','box')", "row('coolerCount','Soğutucu','snowflake')")
          s=s.replace("row('towerCount','Kule','server')", "row('towerCount','Kule','tower')")
          s=s.replace("row('tapCount','Musluk','droplet')", "row('tapCount','Musluk','tap')")
          s=s.replace("row('smarttapCount','SmartTap','activity')", "row('smarttapCount','SmartTap','smarttap')")
          s=s.replace('Saha ekibine hoş geldin','fıçıbakım’a hoş geldin')
          s=s.replace('Bakım görevlerini, müşterilerini ve saha işlemlerini tek yerden yönet.','Daha iyi servis, daha iyi bira. Bakım görevlerini ve saha işlemlerini tek yerden yönet.')
          repl("headerIdentity:{flexDirection:'row',alignItems:'center',gap:11,flex:1}, brandBadge:{width:38,height:38,borderRadius:11,backgroundColor:BLUE,alignItems:'center',justifyContent:'center',borderWidth:1,borderColor:'rgba(255,255,255,.13)'}, eyebrow:{color:'#BFD8EC',fontSize:10,fontWeight:'900',letterSpacing:1.4}, headerTitle:{color:'#fff',fontSize:27,fontWeight:'900',letterSpacing:-.45,marginTop:1}, headerUser:{color:'#C9DDEC',fontSize:12,marginTop:1}", "headerIdentity:{flexDirection:'row',alignItems:'center',gap:11,flex:1,minWidth:0,marginRight:10}, brandImage:{width:42,height:42,borderRadius:12,backgroundColor:'#fff'}, headerCopy:{flex:1,minWidth:0}, eyebrow:{color:'#D7E8F5',fontSize:12,fontWeight:'900',letterSpacing:.4}, headerTitle:{color:'#fff',fontSize:27,fontWeight:'900',letterSpacing:-.45,marginTop:1,flexShrink:1}, headerUser:{color:'#C9DDEC',fontSize:12,marginTop:1}")
          repl("logoMark:{width:58,height:58,borderRadius:17,backgroundColor:BLUE,alignItems:'center',justifyContent:'center',borderWidth:1,borderColor:'rgba(255,255,255,.14)'}, loginBrand:{color:'#fff',fontSize:16,fontWeight:'900',letterSpacing:1.2}, loginBrandSub:{color:'#9FC2DA',fontSize:10,fontWeight:'800',letterSpacing:1.05,marginTop:3}", "loginLogo:{width:62,height:62,borderRadius:18,backgroundColor:'#fff'}, loginBrand:{color:'#fff',fontSize:25,fontWeight:'900',letterSpacing:-.4}, loginBrandSub:{color:'#9FC2DA',fontSize:10,fontWeight:'800',letterSpacing:1.05,marginTop:3}")
          p.write_text(s)

          app=Path('apps/mobile/app.json')
          j=json.loads(app.read_text())
          e=j['expo']; e['name']='fıçıbakım'; e['icon']='./assets/fici-bakim-icon.png'; e['android']['adaptiveIcon']={'foregroundImage':'./assets/fici-bakim-icon.png','backgroundColor':'#FFFFFF'}
          app.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')

          pkg=Path('apps/mobile/package.json')
          pj=json.loads(pkg.read_text()); pj.get('dependencies',{}).pop('@expo/vector-icons',None)
          pkg.write_text(json.dumps(pj,ensure_ascii=False,indent=2)+'\n')

          Path('apps/mobile/assets').mkdir(parents=True,exist_ok=True)
          icon=''
          sprite=''
          Path('apps/mobile/assets/fici-bakim-icon.png').write_bytes(base64.b64decode(icon))
          Path('apps/mobile/assets/icons-sprite.png').write_bytes(base64.b64decode(sprite))
          PY
      - name: Install and verify mobile
        run: |
          npm install
          npm run lint --workspace @fmp/mobile
          npm run bundle:android --workspace @fmp/mobile
      - name: Commit applied changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-fici-bakim-brand.yml
          git add apps/mobile
          git commit -m "feat(mobile): brand app as fıçıbakım with custom icon system"
          git push origin HEAD:feat/fici-bakim-brand-icons
