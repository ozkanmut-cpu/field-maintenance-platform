name: Apply fici bakim brand

on:
  push:
    branches:
      - feat/fici-bakim-brand-icons

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fici-bakim-brand-icons
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply UI patch
        shell: bash
        run: |
          base64 -d .github/fici-text.patch.gz.b64 | gzip -d > /tmp/fici-text.patch
          git apply --check /tmp/fici-text.patch
          git apply /tmp/fici-text.patch
          rm -f .github/fici-text.patch.gz.b64 .github/workflows/apply-fici-bakim-brand.yml
      - name: Validate mobile
        shell: bash
        run: |
          npm install
          npm run lint --workspace @fmp/mobile
          npm run bundle:android --workspace @fmp/mobile
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mobile): brand app as fıçıbakım and refresh icons'
          git push origin HEAD:feat/fici-bakim-brand-icons
