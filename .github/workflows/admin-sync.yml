name: Temporary admin UX sync

on:
  push:
    paths:
      - '.github/workflows/admin-sync.yml'

permissions:
  contents: write

jobs:
  sync-admin-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download production patch
        run: |
          curl -fsSLo /tmp/admin-ux.patch https://field-maintenance-prod.com/__sync/b34b91c42d30523cef660996911aede3.patch
          echo '7dc20cc290436d039a4f4423032c163c10d66d37b7b698ac1c7af51a216eb4c9  /tmp/admin-ux.patch' | sha256sum -c -
      - name: Apply and commit
        run: |
          git apply --check /tmp/admin-ux.patch
          git apply /tmp/admin-ux.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/app/page.tsx apps/admin/app/operations.tsx apps/admin/app/globals.css
          git commit -m 'feat(admin): apply corporate web UX'
          git push origin HEAD:main
