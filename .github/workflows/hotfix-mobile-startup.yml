name: Hotfix mobile startup

on:
  push:
    branches: [hotfix/mobile-startup-crash]
    paths:
      - '.github/workflows/hotfix-mobile-startup.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/mobile-startup-crash
      - name: Remove vector icon runtime dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('apps/mobile/src/CorporateApp.tsx')
          s = p.read_text()
          s = s.replace("import { Feather } from '@expo/vector-icons';\n", "")
          marker = "type Screen = 'TASKS' | 'CUSTOMERS' | 'CUSTOMER' | 'EQUIPMENT_CONFIRM' | 'HELP' | 'NEW' | 'HISTORY' | 'EFESIM_RESULT' | 'PROSPECT' | 'VISIT_SAVED' | 'SUCCESS';\n"
          if 'function Feather(' not in s:
              local = r'''\nfunction Feather({name,size=18,color='#075A96'}:{name:string;size?:number;color?:string}) {\n  const glyphs: Record<string,string> = {\n    tool:'◇', 'log-out':'→', 'log-in':'→', clipboard:'▣', users:'◎', 'user-plus':'+', clock:'◷',\n    'alert-circle':'!', calendar:'□', refresh:'↻', 'refresh-cw':'↻', 'check-circle':'✓', check:'✓',\n    navigation:'↗', 'alert-triangle':'!', hash:'#', 'map-pin':'⌖', box:'□', server:'▤', droplet:'◦',\n    activity:'∿', 'chevron-right':'›', 'arrow-left':'‹', crosshair:'⌾', save:'✓', x:'×',\n    'rotate-ccw':'↶', inbox:'□', info:'i', image:'▧', 'arrow-right':'›'\n  };\n  return <Text style={{fontSize:size,color,fontWeight:'800',lineHeight:size+3,textAlign:'center'}}>{glyphs[name] ?? '•'}</Text>;\n}\n'''
              s = s.replace(marker, marker + local)
          p.write_text(s)

          pkg_path = Path('apps/mobile/package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg.get('dependencies', {}).pop('@expo/vector-icons', None)
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')
          PY
          npm install --package-lock-only
          npm run lint --workspace @fmp/mobile
          npm run bundle:android --workspace @fmp/mobile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src/CorporateApp.tsx apps/mobile/package.json package-lock.json
          git commit -m 'fix(mobile): remove vector icon runtime dependency'
          git push origin HEAD:hotfix/mobile-startup-crash
