name: Operations CI

on:
  push:
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/src/assignments/**'
      - 'apps/api/src/points/**'
      - 'apps/admin/app/operations.tsx'
      - 'apps/admin/app/operations.bulk.smoke.test.mjs'
      - 'apps/admin/app/operations.search.smoke.test.mjs'
      - 'apps/admin/app/operations.approvals.smoke.test.mjs'
      - 'apps/admin/app/setup-pending-navigation.smoke.test.mjs'
      - 'apps/admin/app/anomaly-review.tsx'
      - 'apps/admin/app/anomaly-review.smoke.test.mjs'
      - 'apps/admin/app/maintenance-calendar.tsx'
      - 'apps/admin/app/maintenance-calendar.smoke.test.mjs'
      - 'apps/admin/app/assignment-management.tsx'
      - 'apps/admin/app/assignment-management.smoke.test.mjs'
      - 'apps/admin/app/location-matching.tsx'
      - 'apps/admin/app/location-matching.smoke.test.mjs'
      - 'apps/admin/app/duplicate-suggestions.tsx'
      - 'apps/admin/app/duplicate-suggestions.smoke.test.mjs'
      - 'apps/admin/app/bulk-operations.tsx'
      - 'apps/admin/app/bulk-operations.smoke.test.mjs'
      - 'docs/V1_TODO.md'
      - '.github/workflows/postgis-ci.yml'
      - '.github/workflows/operations-ci.yml'
  pull_request:
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/src/assignments/**'
      - 'apps/api/src/points/**'
      - 'apps/admin/app/operations.tsx'
      - 'apps/admin/app/operations.bulk.smoke.test.mjs'
      - 'apps/admin/app/operations.search.smoke.test.mjs'
      - 'apps/admin/app/operations.approvals.smoke.test.mjs'
      - 'apps/admin/app/setup-pending-navigation.smoke.test.mjs'
      - 'apps/admin/app/anomaly-review.tsx'
      - 'apps/admin/app/anomaly-review.smoke.test.mjs'
      - 'apps/admin/app/maintenance-calendar.tsx'
      - 'apps/admin/app/maintenance-calendar.smoke.test.mjs'
      - 'apps/admin/app/assignment-management.tsx'
      - 'apps/admin/app/assignment-management.smoke.test.mjs'
      - 'apps/admin/app/location-matching.tsx'
      - 'apps/admin/app/location-matching.smoke.test.mjs'
      - 'apps/admin/app/duplicate-suggestions.tsx'
      - 'apps/admin/app/duplicate-suggestions.smoke.test.mjs'
      - 'apps/admin/app/bulk-operations.tsx'
      - 'apps/admin/app/bulk-operations.smoke.test.mjs'
      - 'docs/V1_TODO.md'
      - '.github/workflows/postgis-ci.yml'
      - '.github/workflows/operations-ci.yml'

jobs:
  operations-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm --prefix apps/api run prisma:generate
      - name: Point operation regression tests
        working-directory: apps/api
        run: >-
          node --test --require ts-node/register
          src/points/points.bulk-update.spec.ts
          src/points/point-address-discovery.service.spec.ts
          src/points/point-postgis-migration.spec.ts
          src/points/point-spatial.integration-config.spec.ts
          src/points/point-spatial.service.spec.ts
          src/points/points.nearby.controller.spec.ts
          src/points/points.mobile-search.spec.ts
          src/assignments/assignments.service.spec.ts
      - name: API typecheck
        run: npm --prefix apps/api run lint
      - name: API build
        run: npm --prefix apps/api run build
      - name: Admin point operation smoke tests
        run: >-
          node --test
          apps/admin/app/operations.bulk.smoke.test.mjs
          apps/admin/app/operations.search.smoke.test.mjs
          apps/admin/app/operations.approvals.smoke.test.mjs
          apps/admin/app/setup-pending-navigation.smoke.test.mjs
          apps/admin/app/anomaly-review.smoke.test.mjs
          apps/admin/app/maintenance-calendar.smoke.test.mjs
          apps/admin/app/assignment-management.smoke.test.mjs
          apps/admin/app/location-matching.smoke.test.mjs
          apps/admin/app/duplicate-suggestions.smoke.test.mjs
          apps/admin/app/bulk-operations.smoke.test.mjs
      - name: Admin typecheck
        run: npm --prefix apps/admin run lint
      - name: Admin build
        run: npm --prefix apps/admin run build
