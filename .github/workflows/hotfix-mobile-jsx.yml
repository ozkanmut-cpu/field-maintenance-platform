name: Hotfix mobile JSX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-mobile-jsx.yml'
      - 'apps/mobile/src/CorporateApp.tsx'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair SecondaryButton JSX if needed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/src/CorporateApp.tsx')
          s = p.read_text()
          old = ":null|<Text style={[styles.secondaryText,danger&&styles.secondaryDangerText]}>{title}</Text>"
          new = ":null}<Text style={[styles.secondaryText,danger&&styles.secondaryDangerText]}>{title}</Text>"
          if old not in s:
              print('No repair needed')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          print('Repaired SecondaryButton JSX')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src/CorporateApp.tsx
          git commit -m 'fix(mobile): repair SecondaryButton JSX'
          git push
