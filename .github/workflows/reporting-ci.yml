name: Reporting CI

on:
  push:
    paths:
      - 'apps/api/src/maintenance/**'
      - 'apps/admin/app/paperwork-management.tsx'
      - 'apps/admin/app/paperwork-analytics.smoke.test.mjs'
      - 'apps/admin/app/operations.tsx'
      - 'apps/admin/app/kpi-reporting.tsx'
      - 'apps/admin/app/kpi-reporting.smoke.test.mjs'
      - 'apps/admin/app/daily-admin-summary.smoke.test.mjs'
      - 'apps/admin/app/period-admin-summary.smoke.test.mjs'
      - 'apps/admin/app/technician-daily-summary.smoke.test.mjs'
      - '.github/workflows/reporting-ci.yml'
  pull_request:
    paths:
      - 'apps/api/src/maintenance/**'
      - 'apps/admin/app/paperwork-management.tsx'
      - 'apps/admin/app/paperwork-analytics.smoke.test.mjs'
      - 'apps/admin/app/operations.tsx'
      - 'apps/admin/app/kpi-reporting.tsx'
      - 'apps/admin/app/kpi-reporting.smoke.test.mjs'
      - 'apps/admin/app/daily-admin-summary.smoke.test.mjs'
      - 'apps/admin/app/period-admin-summary.smoke.test.mjs'
      - 'apps/admin/app/technician-daily-summary.smoke.test.mjs'
      - '.github/workflows/reporting-ci.yml'

jobs:
  reporting-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm --prefix apps/api run prisma:generate
      - name: Maintenance and reporting regression tests
        working-directory: apps/api
        run: node --test --require ts-node/register src/maintenance/maintenance-engine.service.spec.ts src/maintenance/paperwork-analytics.spec.ts src/maintenance/daily-admin-summary.spec.ts src/maintenance/period-admin-summary.spec.ts src/maintenance/technician-daily-summary.spec.ts src/maintenance/kpi-reporting.spec.ts
      - name: API typecheck
        run: npm --prefix apps/api run lint
      - name: API build
        run: npm --prefix apps/api run build
      - name: Reporting admin smoke
        run: node --test apps/admin/app/paperwork-analytics.smoke.test.mjs apps/admin/app/daily-admin-summary.smoke.test.mjs apps/admin/app/period-admin-summary.smoke.test.mjs apps/admin/app/technician-daily-summary.smoke.test.mjs apps/admin/app/kpi-reporting.smoke.test.mjs
      - name: Admin typecheck
        run: npm --prefix apps/admin run lint
      - name: Admin build
        run: npm --prefix apps/admin run build
